<!-- Toast Container (same as dashboard) -->
<div class="toast-container">
    <div
        *ngFor="let toast of toasts"
        class="toast"
        [class.toast-leaving]="toast.leaving"
        [class.toast-success]="toast.type === 'success'"
        [class.toast-error]="toast.type === 'error'"
        [class.toast-info]="toast.type === 'info'"
    >
        <span class="toast-icon">
            <span *ngIf="toast.type === 'success'">✓</span>
            <span *ngIf="toast.type === 'error'">✕</span>
            <span *ngIf="toast.type === 'info'">ℹ</span>
        </span>
        <span class="toast-message">{{ toast.message }}</span>
        <button class="toast-dismiss" (click)="dismissToast(toast.id)">×</button>
    </div>
</div>

<section class="page">
    <h2 class="title">Register</h2>
    <p class="subtitle">Create your Service Day Dashboard account.</p>

    <div class="card">
        <div class="field">
            <label>Name</label>
            <input type="text" [(ngModel)]="name" placeholder="e.g., Alice Tan" />
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" placeholder="e.g., alice@company.com" />
        </div>
        <div class="field">
            <label>Department</label>
            <input type="text" [(ngModel)]="department" placeholder="e.g., Business, Information Technology" />
        </div>

        <div class="field">
            <label>Password</label>
            <div class="password-wrap">
                <input
                    [type]="showPassword ? 'text' : 'password'"
                    [(ngModel)]="password"
                    placeholder="Min 8 chars, 1 uppercase, 1 number"
                />
                <button class="btn toggle-btn" type="button" (click)="togglePassword()">
                    {{ showPassword ? 'Hide' : 'Show' }}
                </button>
            </div>
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <div class="password-wrap">
                <input
                    [type]="showConfirm ? 'text' : 'password'"
                    [(ngModel)]="confirmPassword"
                    placeholder="Re-enter your password"
                />
                <button class="btn toggle-btn" type="button" (click)="toggleConfirm()">
                    {{ showConfirm ? 'Hide' : 'Show' }}
                </button>
            </div>
        </div>

        <div class="actions">
            <button class="btn primary" (click)="onRegister()">Register</button>
        </div>

        <p class="hint">
            Already have an account?
            <a class="link" (click)="goToLogin()">Login here</a>
        </p>
    </div>
</section>
