<div class="form-header">
  <h3>{{ isEditing ? 'Edit Activity' : 'Add New Activity' }}</h3>
  <button class="btn small" type="button" (click)="close()">Close</button>
</div>

<form [formGroup]="formGroup" (ngSubmit)="submit()">
  <div class="grid">
    <label>
      ID
      <input type="text" formControlName="id" readonly />
    </label>

    <label>
      Activity Name
      <input
        type="text"
        formControlName="activityName"
        (input)="emitFormValueChange()"
      />
    </label>

    <label>
      NGO
      <select
        formControlName="ngoName"
        (change)="emitFormValueChange()"
      >
        <option value="">Select NGO</option>
        @for (ngo of ngos; track ngo._id) {
          <option [value]="ngo.name">
            {{ ngo.name }}
          </option>
        }
      </select>
    </label>

    <label>
      Location
      <input
        type="text"
        formControlName="location"
        (input)="emitFormValueChange()"
      />
    </label>

    <label>
      Activity Date
      <input
        type="date"
        formControlName="whenDate"
        (input)="emitFormValueChange()"
      />
    </label>

    <label>
      Start Time
      <input
        type="time"
        formControlName="startTime"
        (input)="emitFormValueChange()"
      />
    </label>

    <label>
      End Time
      <input
        type="time"
        formControlName="endTime"
        (input)="emitFormValueChange()"
      />
    </label>

    <label>
      Total Slots (Offered)
      <input
        type="number"
        min="1"
        formControlName="offered"
        (input)="emitFormValueChange()"
      />
    </label>
  </div>

  <label class="full">
    Description
    <textarea
      rows="3"
      formControlName="description"
      (input)="emitFormValueChange()"
    ></textarea>
  </label>

  <label class="full">
    Cut-off Date & Time
    <input
      type="datetime-local"
      formControlName="cutoff"
      (input)="emitFormValueChange()"
    />
  </label>

  <div class="form-actions">
    <button class="btn primary" type="submit" [disabled]="formGroup.invalid">
      {{ isEditing ? 'Update Activity' : 'Add Activity' }}
    </button>
    <button class="btn" type="button" (click)="clear()">Clear</button>
  </div>
</form>
