<section class="card">
  <div class="toolbar">
    <h2>Participants - Activity {{ activityId }}</h2>
    <a class="btn" routerLink="/admin/dashboard">Back to Dashboard</a>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
        </tr>
      </thead>
      <tbody>
        @for (p of participants; track p.id) {
          <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.email }}</td>
            <td>{{ p.department }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
