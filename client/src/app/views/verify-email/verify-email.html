<section class="page">
  <h2 class="title">Email Verification</h2>

  <div class="card">
    @if (status === 'loading') {
      <p class="muted">Verifying your email, please wait...</p>
    }

    @if (status === 'success') {
      <div class="success">{{ message }}</div>
      <p class="hint">Redirecting to login in 3 seconds...</p>
      <div class="actions">
        <button class="btn primary" (click)="goToLogin()">Go to Login</button>
      </div>
    }

    @if (status === 'error') {
      <div class="error">{{ message }}</div>
      <div class="actions">
        <button class="btn primary" (click)="goToLogin()">Go to Login</button>
      </div>
    }
  </div>
</section>
