     <!-- Page Header -->
    <div class="page-header">
        <h1>Notifications</h1>
    </div>
    <!-- Notifications Panel -->
    <div class="card notification-card">
        <div class="notification-header">
        <h3>Notifications (Employee)</h3>
        <div class="notification-actions">
            <button class="btn-outline" (click)="toggleNotifications()">
            {{ notificationsCollapsed ? 'Expand' : 'Collapse' }}
            </button>
            <button class="btn-outline" (click)="clearNotifications()">Clear</button>
        </div>
        </div>
        <div *ngIf="!notificationsCollapsed" class="notification-body">
        <p *ngIf="notifications.length === 0" class="muted">No notifications.</p>
        <ul *ngIf="notifications.length > 0">
            <li *ngFor="let note of notifications">{{ note }}</li>
        </ul>
        </div>
    </div>
