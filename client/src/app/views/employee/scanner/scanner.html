<section class="scanner-page">
  <div class="camera-frame">
    <video #video autoplay muted playsinline></video>
    <div class="scan-window" aria-hidden="true"></div>
    @if (errorMessage) {
      <div class="camera-overlay">
        <span>{{ errorMessage }}</span>
      </div>
    }
  </div>
</section>
