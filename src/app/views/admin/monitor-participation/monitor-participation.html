<div class="page">
  <h2>Monitor Participation</h2>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Employee</th>
          <th>Activity</th>
          <th>Status</th>
          <th>Check-In Time</th>
          <th>Method</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of checkins()">
          <td>{{ item.employee_name }}</td>
          <td>{{ item.activity_name }}</td>
          <td>{{ item.status }}</td>
          <td>{{ item.checkin_time || '-' }}</td>
          <td>{{ item.method }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
