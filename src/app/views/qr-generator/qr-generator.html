<div class="page">
  <h2>Admin QR Generator</h2>

  <button class="reset-btn" (click)="resetCheckins()">
    Reset Check-In Records
  </button>

  <div class="card">
    <label>Select Activity</label>
    <select [(ngModel)]="selectedActivityId">
      <option value="">-- Select Activity --</option>
      <option *ngFor="let activity of activities()" [value]="activity._id">
        {{ activity.activity_name }}
      </option>
    </select>

    <button (click)="generateQR()">Generate QR Code</button>
  </div>

  <div class="card" *ngIf="qrCode">
    <h3>Generated QR Code</h3>
    <p><strong>QR Text:</strong> {{ qrCode }}</p>
    <img *ngIf="qrImageUrl" [src]="qrImageUrl" alt="QR Code" />
  </div>
</div>
